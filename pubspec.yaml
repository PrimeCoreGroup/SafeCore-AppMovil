name: safecore_mobile
description: >-
  SafeCore — aplicación móvil de monitoreo y gestión de protección sísmica y
  contra incendios con nodos Edge (PrimeCore Group).
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: ^3.6.0
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Estado y navegación
  flutter_riverpod: ^2.6.1
  go_router: ^16.0.0

  # Red y conectividad
  dio: ^5.8.0
  connectivity_plus: ^6.1.4

  # Almacenamiento
  sqflite: ^2.4.2
  flutter_secure_storage: ^9.2.4

  # Notificaciones push (opcional en tiempo de ejecución, ver README)
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logos/
    - assets/images/
